<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- =========================================================
         BASIC DOCUMENT CONFIGURATION
    ========================================================== -->
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- =========================================================
         CHURCH FAVICON
         
         IMPORTANT:
         Place your church logo here:

         public/church-logo.png

         The browser will then use the church logo instead
         of the default Vite "G" icon.
    ========================================================== -->
    <link
      rel="icon"
      type="image/png"
      href="/church-logo.png"
    />

    <!-- Apple / Mobile Home Screen Icon -->
    <link
      rel="apple-touch-icon"
      href="/church-logo.png"
    />

    <!-- =========================================================
         WEBSITE INFORMATION / SEO
    ========================================================== -->
    <meta
      name="description"
      content="GolaniSDA – Golani Seventh-day Adventist Church. Join us every Sabbath for worship, fellowship, and growth in Christ."
    />

    <meta
      name="keywords"
      content="Golani SDA, Golani Seventh-day Adventist Church, Seventh-day Adventist, SDA Church, church, worship, Sabbath, ministries, Tanzania"
    />

    <meta
      name="author"
      content="Golani Seventh-day Adventist Church"
    />

    <meta
      name="theme-color"
      content="#0d2137"
    />

    <meta
      name="application-name"
      content="GolaniSDA"
    />

    <!-- =========================================================
         SECURITY
    ========================================================== -->
    <meta
      http-equiv="X-Content-Type-Options"
      content="nosniff"
    />

    <meta
      name="referrer"
      content="strict-origin-when-cross-origin"
    />

    <!-- =========================================================
         OPEN GRAPH / FACEBOOK / WHATSAPP SHARING
    ========================================================== -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="GolaniSDA – Golani Seventh-day Adventist Church"
    />

    <meta
      property="og:description"
      content="Join us every Sabbath for worship, fellowship, and growth in Christ."
    />

    <meta
      property="og:image"
      content="/og-image.jpg"
    />

    <meta
      property="og:url"
      content="https://golanisda.org"
    />

    <meta
      property="og:site_name"
      content="Golani SDA Church"
    />

    <meta
      property="og:locale"
      content="en_US"
    />

    <!-- =========================================================
         TWITTER / X CARD
    ========================================================== -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="GolaniSDA Church"
    />

    <meta
      name="twitter:description"
      content="Join us every Sabbath for worship, fellowship, and growth in Christ."
    />

    <meta
      name="twitter:image"
      content="/og-image.jpg"
    />

    <!-- =========================================================
         GOOGLE FONTS
    ========================================================== -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <!--
      Poppins
      → Main UI / body text

      Cormorant Garamond
      → Headings / elegant church typography

      Cinzel
      → Formal / accent typography
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400;1,500;1,600;1,700&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Cinzel:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- =========================================================
         PAGE TITLE
    ========================================================== -->
    <title>
      GolaniSDA – Golani Seventh-day Adventist Church
    </title>
  </head>

  <body>
    <!-- =========================================================
         VUE APPLICATION ROOT
    ========================================================== -->
    <div id="app"></div>

    <!-- =========================================================
         VUE ENTRY POINT
    ========================================================== -->
    <script
      type="module"
      src="/src/main.js"
    ></script>
  </body>
</html>
