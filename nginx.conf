server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ──────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Django API ────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        client_max_body_size 50M;
    }

    # ── Django Admin ──────────────────────────────────────────────
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Django static files (whitenoise serves from backend) ──────
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Media files (served from shared Docker volume) ────────────
    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public";
        # Prevent executing uploaded files
        add_header Content-Disposition "inline";
    }

    # ── Vue SPA — all other routes go to index.html ───────────────
    location / {
        try_files $uri $uri/ /index.html;
        # Cache HTML briefly; assets are fingerprinted so can be long
        add_header Cache-Control "no-cache";
    }

    # ── Cache fingerprinted assets forever ───────────────────────
    location ~* \.(js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Max upload size ───────────────────────────────────────────
    client_max_body_size 50M;
}
